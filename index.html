<!DOCTYPE html>
<!-- owns: canvas root, controls and classic-script load order
     edit for: markup, control bounds, labels and script ordering -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Light Square</title>
<style>
	body { background: #000; color: #cfd6e4; font: 14px system-ui, sans-serif; margin: 0; padding: 12px; display: flex; justify-content: center; }
	#layout { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
	#stage { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; min-width: 0; }
	#side { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: flex-start; }
	/* square kept by width-driven sizing; height caps keep readouts on screen */
	#canv { width: min(100%, calc(100dvh - 120px)); aspect-ratio: 1; touch-action: none; }
	#readout span { margin-right: 14px; }
	#readout-generation { color: #8b93a7; text-align: center; max-width: 760px; }
	input[type=number] { width: 4em; }
	#readout-msg { color: #8b93a7; }
	fieldset { border: 1px solid #2a2f3a; border-radius: 6px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
	#rotation-controls { display: grid; grid-template-columns: repeat(2, auto); gap: 6px; }
	.rotate-stack { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
	.laser-row { display: flex; gap: 8px; }
	legend { color: #8b93a7; padding: 0 6px; }
	button { background: #141821; color: #cfd6e4; border: 1px solid #2a2f3a; border-radius: 6px; padding: 6px 12px; }
	button:active { background: #232a38; }
	button[aria-pressed="true"] { background: #1c2c44; border-color: #4f77b8; color: #eef4ff; }
	input[type=range] { width: 130px; }
	#snd-more { width: 100%; color: #8b93a7; }
	#snd-more summary { cursor: pointer; margin-bottom: 6px; }
	.snd-grid, #snd-params { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
	.snd-grid label, #snd-params label { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; color: #cfd6e4; }
	/* wide landscape: control groups left, canvas fills the rest; narrow stays vertical with the canvas on top */
	@media (orientation: landscape) and (min-width: 760px) and (min-height: 480px) {
		#layout { flex-direction: row; gap: 24px; }
		#stage { flex: 1; }
		#side { order: -1; flex-direction: column; flex-wrap: nowrap; align-items: stretch; width: 330px; }
		#side fieldset { justify-content: flex-start; }
		#canv { width: min(100%, calc(100dvh - 104px)); }
	}
</style>
</head>
<body>
<div id="layout">
<div id="stage">
<canvas id="canv"></canvas>
<div id="readout" aria-live="polite"><span id="readout-pct">0%</span><span id="readout-msg"></span><span id="readout-rules"></span></div>
<div id="readout-generation" aria-live="polite" title="Walk escape is a fixed random-walk probe, not a human skill rating."></div>
</div>
<div id="side">
<fieldset><legend>Hints</legend>
<label><input type="checkbox" id="hint-current"> Current matches</label>
<label><input type="checkbox" id="hint-discoveries"> Remember discoveries</label>
<label><input type="checkbox" id="hint-targets"> Show targets</label>
<button id="btn-preview">Preview (hold)</button>
</fieldset>
<fieldset><legend>Rotate squares · CCW / CW</legend>
<div class="rotate-stack">
<div id="rotation-controls">
<button id="btn-ccw-0" aria-label="Outer square counterclockwise, shortcut 1">Outer ↶ 1</button>
<button id="btn-cw-0" aria-label="Outer square clockwise, shortcut 2">Outer ↷ 2</button>
<button id="btn-ccw-1" aria-label="Middle square counterclockwise, shortcut Q">Middle ↶ Q</button>
<button id="btn-cw-1" aria-label="Middle square clockwise, shortcut W">Middle ↷ W</button>
<button id="btn-ccw-2" aria-label="Inner square counterclockwise, shortcut A">Inner ↶ A</button>
<button id="btn-cw-2" aria-label="Inner square clockwise, shortcut S">Inner ↷ S</button>
<button id="btn-ccw-3" aria-label="Flip center, shortcut Z">Center ↶ Z</button>
<button id="btn-cw-3" aria-label="Flip center, shortcut X">Center ↷ X</button>
</div>
<div class="laser-row">
<button id="btn-left">&#9664;</button>
<button id="btn-right">&#9654;</button>
</div>
</div>
</fieldset>
<fieldset><legend>Puzzle · a change generates a new one</legend>
<select id="rule-mode"><option value="0">quarter turns</option><option value="1">single slots</option></select>
<label><input type="checkbox" id="rule-corner"> corners flip</label>
<label for="mirror-count" id="mirror-count-label">Mirrors 11/49</label>
<input type="number" id="mirror-count" min="1" max="49" step="1" value="11" title="Fewer mirrors reduce visual clutter. Difficulty does not change their count.">
<label for="difficulty" id="difficulty-label">Difficulty 25/100</label>
<input type="range" id="difficulty" min="0" max="100" step="1" value="25" title="Seeks a harder fixed random-walk score, not a human skill rating.">
<button id="btn-generate">Generate</button>
<button id="btn-restart">Restart</button>
</fieldset>
<fieldset><legend>Look</legend>
<select id="skin" title="Render skin: glass or prototype."><option value="glass">glass</option><option value="prototype">prototype</option></select>
<label>ray <select id="ray" title="Thin beam core style; the soft glow stays as-is."><option value="lines">lines</option><option value="long">fast long dashes</option><option value="short" selected>short dashes</option></select></label>
</fieldset>
<fieldset><legend>Sound</legend>
<label id="snd-on-wrap" title="Enable or mute sound (shortcut M)."><input type="checkbox" id="snd-on" checked> Sound on</label>
<select id="snd-variant" title="Synth voice for photon interactions.">
<option value="glass">Glass Harp</option>
<option value="prism">Prism Pad</option>
<option value="comet">Comet</option>
<option value="pulse">Pulse</option>
<option value="grains">Crystal Grains</option>
<option value="spectrum">Spectrum Drift</option>
</select>
<select id="snd-move" title="Movement sound for square rotations and laser rail. Spectrum Drift auto-selects drum mechanism, other voices auto-select natural mechanism; a manual choice sticks until the voice changes.">
<option value="natural" selected>natural mechanism</option>
<option value="drum">drum mechanism</option>
<option value="bearing">s2</option>
</select>
<label for="snd-volume" id="snd-volume-label">Vol 70%</label>
<input type="range" id="snd-volume" min="0" max="100" step="1" value="70" title="Master output volume.">
<label for="snd-speed" id="snd-speed-label">Speed 4/s</label>
<input type="range" id="snd-speed" min="1" max="16" step="0.5" value="4" title="Photon flight speed in cells per second.">
<select id="snd-mode" title="When photon waves launch.">
<option value="move">on move</option>
<option value="loop">loop</option>
<option value="bed">bed only</option>
<option value="off">off</option>
</select>
<button id="snd-replay" title="Send a fresh audible photon wave for the current pose.">Replay</button>
<details id="snd-more"><summary>Tuning &amp; timbre</summary>
<div class="snd-grid">
<label>scale <select id="snd-scale" title="Musical scale quantizing photon and receiver pitches.">
<option value="majorPent">major pentatonic</option>
<option value="minorPent">minor pentatonic</option>
<option value="lydian">lydian</option>
<option value="wholeTone">whole tone</option>
<option value="hirajoshi">hirajoshi</option>
</select></label>
<label>root <select id="snd-root" title="Tonic root note.">
<option value="C">C</option>
<option value="D">D</option>
<option value="Eb">Eb</option>
<option value="F">F</option>
<option value="G">G</option>
<option value="A">A</option>
<option value="Bb">Bb</option>
</select></label>
<label>pitch <select id="snd-pitch" title="Board position or turn/bounce path contour.">
<option value="position">position</option>
<option value="contour">contour</option>
</select></label>
<label title="Horizontal stereo pan spread.">width <input type="range" id="snd-width" min="0" max="100" step="1" value="85"></label>
<label title="Reverb send and tail length.">reverb <input type="range" id="snd-reverb" min="0" max="100" step="1" value="45"></label>
<label title="Sustained receiver chord bed level.">bed <input type="range" id="snd-bed" min="0" max="100" step="1" value="50"></label>
</div>
<div id="snd-params"></div>
</details>
</fieldset>
</div>
</div>
<script src="board.js"></script>
<script src="trace.js"></script>
<script src="contract.js"></script>
<script src="difficulty.js"></script>
<script src="hints.js"></script>
<script src="presets.js"></script>
<script src="generate.js"></script>
<script src="rim.js"></script>
<script src="render.js"></script>
<script src="renderAlt.js"></script>
<script src="skins.js"></script>
<script src="sonify.js"></script>
<script src="patchesFlow.js"></script>
<script src="patchesSpectrum.js"></script>
<script src="patches.js"></script>
<script src="soundfxNatural.js"></script>
<script src="soundfx.js"></script>
<script src="audio.js"></script>
<script src="soundpanel.js"></script>
<script src="game.js"></script>
<script src="input.js"></script>
<script src="app.js"></script>
</body>
</html>
