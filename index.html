<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Light Square</title>
<style>
	body { background: #000; color: #cfd6e4; font: 14px system-ui, sans-serif; margin: 0; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
	#canv { width: min(92vmin, 680px); aspect-ratio: 1; touch-action: none; }
	#readout span { margin-right: 14px; }
	#readout-msg { color: #8b93a7; }
	#panel { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
	fieldset { border: 1px solid #2a2f3a; border-radius: 6px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
	#rotation-controls { display: grid; grid-template-columns: repeat(2, auto); gap: 6px; }
	.rotate-stack { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
	.laser-row { display: flex; gap: 8px; }
	.side-stack { display: flex; flex-direction: column; gap: 14px; }
	legend { color: #8b93a7; padding: 0 6px; }
	button { background: #141821; color: #cfd6e4; border: 1px solid #2a2f3a; border-radius: 6px; padding: 6px 12px; }
	button:active { background: #232a38; }
	input[type=range] { width: 130px; }
</style>
</head>
<body>
<canvas id="canv"></canvas>
<div id="readout" aria-live="polite"><span id="readout-pct">0%</span><span id="readout-msg"></span><span id="readout-rules"></span></div>
<div id="panel">
<fieldset><legend>Rotate squares · CCW / CW</legend>
<div class="rotate-stack">
<div id="rotation-controls">
<button id="btn-ccw-0" aria-label="Outer square counterclockwise, shortcut 1">Outer ↶ 1</button>
<button id="btn-cw-0" aria-label="Outer square clockwise, shortcut 2">Outer ↷ 2</button>
<button id="btn-ccw-1" aria-label="Middle square counterclockwise, shortcut Q">Middle ↶ Q</button>
<button id="btn-cw-1" aria-label="Middle square clockwise, shortcut W">Middle ↷ W</button>
<button id="btn-ccw-2" aria-label="Inner square counterclockwise, shortcut A">Inner ↶ A</button>
<button id="btn-cw-2" aria-label="Inner square clockwise, shortcut S">Inner ↷ S</button>
<button id="btn-ccw-3" aria-label="Flip center, shortcut Z">Center ↶ Z</button>
<button id="btn-cw-3" aria-label="Flip center, shortcut X">Center ↷ X</button>
</div>
<div class="laser-row">
<button id="btn-left">&#9664;</button>
<button id="btn-right">&#9654;</button>
</div>
</div>
</fieldset>
<div class="side-stack">
<fieldset><legend>Hints</legend>
<label><input type="checkbox" id="hint-current"> Current matches</label>
<label><input type="checkbox" id="hint-discoveries"> Remember discoveries</label>
<label><input type="checkbox" id="hint-targets"> Show targets</label>
<button id="btn-preview">Preview (hold)</button>
</fieldset>
<fieldset><legend>Generate</legend>
<select id="rule-mode"><option value="0">quarter turns</option><option value="1">single slots</option></select>
<label><input type="checkbox" id="rule-corner"> corners flip</label>
<input type="range" id="band" min="0" max="2" step="1" value="1" title="difficulty">
<span id="band-label"></span>
<button id="btn-generate">Generate</button>
<button id="btn-restart">Restart</button>
</fieldset>
</div>
</div>
<script src="board.js"></script>
<script src="trace.js"></script>
<script src="contract.js"></script>
<script src="hints.js"></script>
<script src="generate.js"></script>
<script src="rim.js"></script>
<script src="render.js"></script>
<script src="game.js"></script>
<script src="input.js"></script>
<script src="app.js"></script>
</body>
</html>
